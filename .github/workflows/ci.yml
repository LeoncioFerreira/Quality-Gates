name: CI - Quality Gates

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Permitir a execução do Gradle Wrapper
        run: chmod +x gradlew

      - name: Executar o Quality Gate
        run: ./gradlew clean qualityGate --continue --no-daemon

      - name: Publicar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: build/reports/tests/
          if-no-files-found: warn

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: build/reports/jacoco/
          if-no-files-found: warn

      - name: Publicar relatórios de análise estática
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-analise-estatica
          path: |
            build/reports/detekt/
            build/reports/ktlint/
          if-no-files-found: warn

      - name: Analisar no SonarQube Cloud
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != ''
        run: ./gradlew sonar --no-daemon
